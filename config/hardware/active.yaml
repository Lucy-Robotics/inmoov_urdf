version: 1
robot_name: inmoov
generated_files:
  ros2_control_xacro: inmoov_ros2_control.xacro
  controllers_yaml: controllers.yaml
passive_urdf_joints: []
ignore_urdf_joints:
  - i02_leftHand_indexMid_joint
  - i02_leftHand_indexTip_joint
  - i02_leftHand_majeureMid_joint
  - i02_leftHand_majeureTip_joint
  - i02_leftHand_pinkyMid_joint
  - i02_leftHand_pinkyTip_joint
  - i02_leftHand_ringFingerMid_joint
  - i02_leftHand_ringFingerTip_joint
  - i02_leftHand_ThumbTip_joint
  - i02_rightHand_indexMid_joint
  - i02_rightHand_indexTip_joint
  - i02_rightHand_majeureMid_joint
  - i02_rightHand_majeureTip_joint
  - i02_rightHand_pinkyMid_joint
  - i02_rightHand_pinkyTip_joint
  - i02_rightHand_ringFingerMid_joint
  - i02_rightHand_ringFingerTip_joint
  - i02_rightHand_ThumbTip_joint
cameras:
  - id: ext_camera
    name: External USB Webcam
    topic: /ext_camera/jpg
    compressed_topic: /ext_camera/jpg/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: true
    sim_gz_topic: /world/default/camera
  - id: realsense-rgb
    name: Realsense RGB
    topic: /realsense/realsense2_camera/color/image_raw
    compressed_topic: /realsense/realsense2_camera/color/image_raw/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_left_eye_vertical
  - id: realsense-aligned-depth
    name: Realsense Aligned Depth
    topic: /realsense/realsense2_camera/aligned_depth_to_color/image_raw
    compressed_topic: /realsense/realsense2_camera/aligned_depth_to_color/image_raw/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_left_eye_vertical
  - id: left_eye_camera
    name: Left eye webcam
    topic: /camera/internal/left_eye/jpg
    compressed_topic: /camera/internal/left_eye/jpg/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_right_eye_vertical
  - id: right_eye_camera
    name: Right eye webcam
    topic: /camera/internal/right_eye/jpg
    compressed_topic: /camera/internal/right_eye/jpg/compressed
    message_type: sensor_msgs/msg/CompressedImage
    external: false
    link: i02_head_left_eye_vertical
firmware:
  source_dir: lucy_embedded_firmware
  build_dir: build/firmware
controller_manager:
  update_rate: 100
# One USB-CDC per board: slave_address is per serial port (default 1 is fine).
boards:
  rp2040_left_arm:
    serial_id: E6617C93E3858429
    board_class: internal_servo_only
    slave_address: 1
    internal_servo_slots: 18
    firmware_target: lucy_left_arm
    compile_definition: USE_LEFT_ARM
    topic_actuators: actuators/left_arm
    topic_sensors: sensors/left_arm
    controller:
      name: left_arm_controller
      type: joint_trajectory_controller/JointTrajectoryController
  rp2040_right_arm:
    serial_id: E6617C93E37A6629
    board_class: internal_servo_only
    slave_address: 1
    internal_servo_slots: 18
    firmware_target: lucy_right_arm
    compile_definition: USE_RIGHT_ARM
    topic_actuators: actuators/right_arm
    topic_sensors: sensors/right_arm
    controller:
      name: right_arm_controller
      type: joint_trajectory_controller/JointTrajectoryController
  rp2040_torso_head:
    serial_id: ''
    board_class: internal_servo_i2c_pwm
    slave_address: 1
    internal_servo_slots: 16
    firmware_target: lucy_torso
    compile_definition: USE_TORSO
    topic_actuators: actuators/torso
    topic_sensors: sensors/torso
    controller:
      name: torso_head_controller
      type: joint_trajectory_controller/JointTrajectoryController
actuators:
