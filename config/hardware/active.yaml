    urdf_joint: left_shoulder_y_joint
    board: rp2040_torso_head
    virtual_pin: 0
    physical_pin: 5
    servo_type: '270'
    offset: 0
    direction: 1
    scale: 1
    limit_min: 0
    limit_max: 3.14159
    default: 0
    enabled: false
